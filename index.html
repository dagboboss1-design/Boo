<script>
if ('serviceWorker' in navigator) {
    const swCode = `self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('activate', e => self.clients.claim());`;
    const blob = new Blob([swCode], {type: 'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(e => console.log('SW failed', e));
}

const DEFAULT_TWELVE = '9b213c4f75d2427bbcd832d592b3a1f0';
const TRADING_EXPERT_PROMPT = `You are DAGBO, an elite trading mentor. Answer ANY question about trading, ICT, SMC, risk management and market history. Be direct, accurate, and actionable.`;

function esc(s) { return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

const STATE = {
    balance: parseFloat(localStorage.getItem('dagbo_balance')) || 1000.00,
    riskMode: localStorage.getItem('dagbo_riskMode') || 'Normal',
    defaultRr: parseInt(localStorage.getItem('dagbo_rr')) || 2,
    riskPct: parseFloat(localStorage.getItem('dagbo_riskPct')) || 1.0,
    manualLot: parseFloat(localStorage.getItem('dagbo_manualLot')) || 0,
    twelveKey: localStorage.getItem('dagbo_twelve_key') || DEFAULT_TWELVE,
    workerUrl: localStorage.getItem('dagbo_worker_url') || 'https://dagbo-ai.YOUR-NAME.workers.dev',
    tgToken: localStorage.getItem('dagbo_tg_token') || '',
    tgChatId: localStorage.getItem('dagbo_tg_chat') || '',
    soundMode: localStorage.getItem('dagbo_soundMode') || 'all',
    voiceName: localStorage.getItem('dagbo_voiceName') || 'default',
    autoPilot: localStorage.getItem('dagbo_autopilot') === 'true',
    trades: JSON.parse(localStorage.getItem('dagbo_trades')) || [],
    pendingOrders: JSON.parse(localStorage.getItem('dagbo_pending')) || [],
    alerts: JSON.parse(localStorage.getItem('dagbo_alerts')) || [],
    notifications: JSON.parse(localStorage.getItem('dagbo_notifs')) || [],
    marketData: {},
    isSimulated: false,
    lastUpdated: Date.now(),
    activeChat: JSON.parse(localStorage.getItem('dagbo_chat')) || [{ role: 'assistant', text: 'Hello trader! I am DAGBO AI. Ask me anything.' }],
    propFirm: JSON.parse(localStorage.getItem('dagbo_propfirm')) || { accountSize: 1000, profitTargetPct: 10, dailyLimitPct: 5, maxDDPct: 10, peakBalance: 1000, todayStartBalance: 1000, todayDate: new Date().toDateString() },
    spikeAlerted: JSON.parse(localStorage.getItem('dagbo_spikeAlerts')) || {}
};

const PAIRS = [
    { symbol:'DXY', name:'Dollar Index', base:104.50, td:'DXY' },
    { symbol:'GOLD', name:'XAU/USD', base:4061.52, td:'XAU/USD' }, 
    { symbol:'SILVER', name:'XAG/USD', base:31.85, td:'XAG/USD' },
    { symbol:'BTC/USD', name:'Bitcoin', base:96400, td:'BTC/USD' },
    { symbol:'US30', name:'Dow Jones', base:43800, td:'DJI' },
    { symbol:'NAS100', name:'Nasdaq 100', base:20500, td:'NDX' },
    { symbol:'USOIL', name:'WTI Crude', base:71.40, td:'WTI' },
    { symbol:'EUR/USD', name:'Euro / Dollar', base:1.0420, td:'EUR/USD' },
    { symbol:'GBP/USD', name:'Pound / Dollar', base:1.2530, td:'GBP/USD' },
    { symbol:'USD/JPY', name:'Dollar / Yen', base:153.10, td:'USD/JPY' },
    { symbol:'GBP/JPY', name:'Pound / Yen', base:192.40, td:'GBP/JPY' },
    { symbol:'AUD/USD', name:'Aussie / Dollar', base:0.6420, td:'AUD/USD' }
];

function saveState() {
    localStorage.setItem('dagbo_balance', STATE.balance);
    localStorage.setItem('dagbo_riskMode', STATE.riskMode);
    localStorage.setItem('dagbo_rr', STATE.defaultRr);
    localStorage.setItem('dagbo_riskPct', STATE.riskPct);
    localStorage.setItem('dagbo_manualLot', STATE.manualLot);
    localStorage.setItem('dagbo_twelve_key', STATE.twelveKey);
    localStorage.setItem('dagbo_worker_url', STATE.workerUrl);
    localStorage.setItem('dagbo_tg_token', STATE.tgToken);
    localStorage.setItem('dagbo_tg_chat', STATE.tgChatId);
    localStorage.setItem('dagbo_soundMode', STATE.soundMode);
    localStorage.setItem('dagbo_voiceName', STATE.voiceName);
    localStorage.setItem('dagbo_autopilot', STATE.autoPilot);
    localStorage.setItem('dagbo_trades', JSON.stringify(STATE.trades));
    localStorage.setItem('dagbo_pending', JSON.stringify(STATE.pendingOrders));
    localStorage.setItem('dagbo_alerts', JSON.stringify(STATE.alerts));
    localStorage.setItem('dagbo_notifs', JSON.stringify(STATE.notifications.slice(0, 30)));
    localStorage.setItem('dagbo_chat', JSON.stringify(STATE.activeChat));
    localStorage.setItem('dagbo_propfirm', JSON.stringify(STATE.propFirm));
    localStorage.setItem('dagbo_spikeAlerts', JSON.stringify(STATE.spikeAlerted));
}

function fmtPrice(v, d = 2) { if (isNaN(v)) return '0.00'; return Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function getDecimals(s) { if (s.includes('JPY')) return 2; if (s.includes('EUR') || s.includes('GBP') || s.includes('AUD') || s.includes('USD/CHF')) return 4; return 2; }

const CONTRACT_SIZES = { 'DXY': 1000, 'GOLD': 100, 'SILVER': 5000, 'BTC/USD': 1, 'US30': 1, 'NAS100': 1, 'USOIL': 1000, 'EUR/USD': 100000, 'GBP/USD': 100000, 'USD/JPY': 100000, 'GBP/JPY': 100000, 'AUD/USD': 100000 };
const PIP_SIZES = { 'DXY': 0.01, 'GOLD': 0.10, 'SILVER': 0.01, 'BTC/USD': 1, 'US30': 1, 'NAS100': 1, 'USOIL': 0.01, 'EUR/USD': 0.0001, 'GBP/USD': 0.0001, 'USD/JPY': 0.01, 'GBP/JPY': 0.01, 'AUD/USD': 0.0001 };

function getMultiplier(s) { let m = CONTRACT_SIZES[s] || 100000; if(s && s.endsWith('/JPY')) m /= (STATE.marketData['USD/JPY']?.price || 153.1); return m; }
function getPipSize(s) { return PIP_SIZES[s] || 0.0001; }
function getPipValue(s) { return getMultiplier(s) * getPipSize(s); }

function calcAutoLot(symbol, slPips, balance, riskPct) {
    const risk = balance * (riskPct / 100); const lots = risk / (slPips * getPipValue(symbol));
    return Math.max(0.01, Math.round(lots * 100) / 100);
}
function finalLot(symbol, slPips) { if (STATE.manualLot > 0) return STATE.manualLot; return calcAutoLot(symbol, slPips, STATE.balance, STATE.riskPct); }

function calcEMA(prices, period) { if(!prices || prices.length < period) return prices[0]; const k = 2/(period+1); let ema = prices[0]; for(let i=1; i<prices.length; i++) ema = prices[i]*k + ema*(1-k); return ema; }
function calcRSI(closes, period=14) { if(closes.length < period+1) return 50; let gains=0, losses=0; for(let i=closes.length-period; i<closes.length; i++){ const diff = closes[i]-closes[i-1]; if(diff>=0) gains+=diff; else losses-=diff; } return 100 - (100 / (1 + (losses===0?100:gains/losses))); }
function calcATR(highs, lows, closes, period=14) { if(highs.length < period+1) return (Math.max(...highs)-Math.min(...lows))/10; let trs=[]; for(let i=1; i<highs.length; i++) trs.push(Math.max(highs[i]-lows[i], Math.abs(highs[i]-closes[i-1]), Math.abs(lows[i]-closes[i-1]))); return trs.slice(-period).reduce((a,b)=>a+b,0)/period; }

function pushNotif(type, title, body) {
    STATE.notifications.unshift({ type, title: String(title), body: String(body), time: Date.now() });
    STATE.notifications = STATE.notifications.slice(0, 30); saveState();
    const b = document.getElementById('notifBadge'); if (b) b.classList.remove('hidden');

    if ('Notification' in window && Notification.permission === 'granted') {
        try { new Notification(title, { body: body, icon: 'https://cdn-icons-png.flaticon.com/512/2933/2933859.png', vibrate: [200, 100, 200] }); } catch (e) {}
    }
}

function showToast(msg, type = 'info') {
    const toast = document.createElement('div'); let cls = 'bg-darkSurface border-accentBlue text-white';
    if (type === 'success') cls = 'bg-accentGreen/20 border-accentGreen text-accentGreen';
    if (type === 'error') cls = 'bg-accentRed/20 border-accentRed text-accentRed';
    toast.className = `fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl border ${cls} text-xs font-medium shadow-xl backdrop-blur-md animate-bounce max-w-[90%]`;
    toast.innerText = msg; document.body.appendChild(toast); setTimeout(() => toast.remove(), 3000);
}

function vib(p = [200, 100, 200], isAlert = false) { if (STATE.soundMode === 'off') return; if (STATE.soundMode === 'alerts' && !isAlert) return; if ('vibrate' in navigator) { try { navigator.vibrate(p); } catch(e){} } }

// --- VOICE CHANGER LOGIC ---
function speak(text, isAlert = false) {
    if (STATE.soundMode === 'off') return;
    if (STATE.soundMode === 'alerts' && !isAlert) return;
    if (!('speechSynthesis' in window)) return;
    try { 
        const u = new SpeechSynthesisUtterance(text); 
        u.rate = 1.1; 
        if (STATE.voiceName && STATE.voiceName !== 'default') {
            const voices = speechSynthesis.getVoices();
            const selected = voices.find(v => v.name === STATE.voiceName);
            if (selected) u.voice = selected;
        }
        speechSynthesis.speak(u); 
    } catch(e){}
}
function populateVoices() {
    if (!('speechSynthesis' in window)) return;
    const voices = speechSynthesis.getVoices();
    const sel = document.getElementById('sVoice');
    if(!sel) return;
    sel.innerHTML = '<option value="default">Default System Voice</option>';
    voices.forEach(v => {
        sel.innerHTML += `<option value="${v.name}">${v.name} (${v.lang})</option>`;
    });
    sel.value = STATE.voiceName;
}

async function sendTg(text) { if (!STATE.tgToken || !STATE.tgChatId) return; try { await fetch(`https://api.telegram.org/bot${STATE.tgToken}/sendMessage?chat_id=${STATE.tgChatId}&text=${encodeURIComponent(text)}`); } catch(e){} }

const router = {
    current: 'home',
    navigate(pageId, param = null, tf = null) {
        this.current = pageId;
        document.querySelectorAll('nav button[id^="nav-"]').forEach(b => { b.classList.remove('text-accentBlue'); b.classList.add('text-slate-400'); });
        const a = document.getElementById(`nav-${pageId}`); if (a) { a.classList.remove('text-slate-400'); a.classList.add('text-accentBlue'); }
        const c = document.getElementById('appContent'); c.scrollTop = 0;
        if (pageId === 'home') renderHome(c); else if (pageId === 'swing') renderSwing(c, param, tf);
        else if (pageId === 'spike') renderSpike(c); else if (pageId === 'ai') renderAI(c);
        else if (pageId === 'journal') renderJournal(c); else if (pageId === 'settings') renderSettings(c);
    }
};

function updateClock() {
    const n = new Date(); 
    const localH = n.getHours(), localM = String(n.getMinutes()).padStart(2,'0');
    const h = n.getUTCHours(), m = String(n.getUTCMinutes()).padStart(2,'0');
    let session = 'Asian';
    if (h >= 7 && h < 13) session = 'London';
    else if (h >= 13 && h < 21) session = 'New York';
    else if (h >= 21 || h < 7) session = 'Sydney';
    const el = document.getElementById('sessionClock'); 
    if (el) el.innerText = `${session} | L: ${localH}:${localM} | GMT: ${h}:${m}`;
}
setInterval(updateClock, 1000); updateClock();

function checkAutoBackup() {
    const last = localStorage.getItem('dagbo_last_backup') || 0;
    if (Date.now() - last > 86400000) {
        localStorage.setItem('dagbo_last_backup', Date.now());
        exportBackup(true);
        pushNotif('alert', 'Auto Backup', 'Daily backup file downloaded.');
    }
}
setInterval(checkAutoBackup, 3600000);

function updateHomePrices() {
    if (router.current !== 'home') return;
    PAIRS.forEach(p => {
        const d = STATE.marketData[p.symbol]; if (!d) return;
        const dec = getDecimals(p.symbol);
        const px = document.querySelector(`[data-px="${p.symbol}"]`);
        const ch = document.querySelector(`[data-chg="${p.symbol}"]`);
        if (px) px.textContent = '$' + fmtPrice(d.price, dec);
        if (ch) { 
            ch.textContent = (d.change >= 0 ? '+' : '') + d.change + '%';
            ch.className = 'text-[11px] font-semibold ' + (d.change >= 0 ? 'text-accentGreen' : 'text-accentRed');
        }
    });
}

async function fetchPrices(force = false) {
    const now = Date.now();
    if (!force && now - STATE.lastUpdated < 300000) return;

    if (!STATE.twelveKey) { simulatePrices(); STATE.isSimulated = true; updateSimBadge(); return; }
    try {
        const tdSymbols = PAIRS.map(p => p.td).join(',');
        const r = await fetch(`https://api.twelvedata.com/quote?symbol=${tdSymbols}&apikey=${STATE.twelveKey}`);
        const data = await r.json();
        
        if (data.code === 429 || data.status === "error") throw new Error("Rate Limit");
        
        STATE.isSimulated = false; STATE.lastUpdated = Date.now(); updateSimBadge();
        
        PAIRS.forEach(p => {
            const q = data[p.td];
            if (q && q.close) {
                const price = parseFloat(q.close);
                const change = parseFloat(q.percent_change || 0);
                if (!STATE.marketData[p.symbol]) STATE.marketData[p.symbol] = { sparkline: [] };
                STATE.marketData[p.symbol].price = price;
                STATE.marketData[p.symbol].change = change;
                STATE.marketData[p.symbol].sparkline.push(price);
                if (STATE.marketData[p.symbol].sparkline.length > 30) STATE.marketData[p.symbol].sparkline.shift();
            }
        });
    } catch(e) {
        STATE.isSimulated = true; updateSimBadge(); simulatePrices();
    }
    checkAlerts();
    checkPendingOrders();
    updateHomePrices();
}

function simulatePrices() {
    let gold = STATE.marketData['GOLD']?.price || 4061.52;
    for (const p of PAIRS) {
        const base = p.symbol === 'GOLD' ? gold : p.base;
        const cur = STATE.marketData[p.symbol]?.price || base;

                sendTg(`💰 PARTIAL CLOSE: 50% of ${t.symbol} hit 1:1. +$${fmtPrice(partialPnl)}`);

        if (t.partialClosed) {

            const atr = calcATR(spark, spark, spark);
            const trailDist = atr * 1.5;
            if (t.type === 'BUY') { const nsl = cur - trailDist; if (nsl > t.sl) { t.sl = nsl; saveState(); } } 
            else { const nsl = cur + trailDist; if (nsl < t.sl) { t.sl = nsl; saveState(); } }
        }

        const hitTp = t.type === 'BUY' ? cur >= t.tp : cur <= t.tp;
        const hitSl = t.type === 'BUY' ? cur <= t.sl : cur >= t.sl;
        
        if (hitTp) {

            showToast(`🎯 TP HIT ${t.symbol}! +$${fmtPrice(realized)}`, 'success');

            sendTg(`🎯 WON: ${t.symbol} ${t.type} TP!`); pushNotif('win', `TP HIT ${t.symbol}`, `+$${fmtPrice(realized)}`);

function analyzeTF(symbol, tf) {
    const data = STATE.marketData[symbol];
    if (!data || !data.sparkline || data.sparkline.length < 5) return null;
    const spark = data.sparkline; const price = data.price;
    const range = (Math.max(...spark) - Math.min(...spark)) / price;
    const tfWeight = { '5M': 1.0, '15M': 1.2, '1H': 1.5, '4H': 1.8, '1D': 2.0 }[tf];
    const ema50 = calcEMA(spark, Math.min(spark.length, 10)); const rsi = calcRSI(spark);
    const trendScore = (price > ema50) ? 40 : 0; const volScore = Math.min(range * 8000, 30); const rsiScore = (rsi > 50 && rsi < 70) ? 20 : (rsi < 50 && rsi > 30) ? 20 : 0;
    const rawScore = (volScore + trendScore + rsiScore) * tfWeight; const direction = price > ema50 ? 'BUY' : 'SELL';
    const confidence = Math.min(99, Math.round(35 + Math.abs(rsi - 50) * 1.5 + (range * 1000)));
    return { score: rawScore, direction, volatility: range, trendStrength: trendScore/40, confidence };
}
function slPipsForTf(tf, symbol) {
    const base = (symbol === 'BTC/USD') ? 100 : (symbol === 'US30' || symbol === 'NAS100') ? 50 : (symbol === 'GOLD') ? 5 : 1;
    const t = { '5M': 15, '15M': 30, '1H': 60, '4H': 120, '1D': 250 }[tf];
    return t * base; 
}
function runAutoScan() {
    const tfs = ['5M', '15M', '1H', '4H', '1D']; const results = [];
    for (const pair of PAIRS) { for (const tf of tfs) { const a = analyzeTF(pair.symbol, tf); if (a && a.score > 0) results.push({ symbol: pair.symbol, pairName: pair.name, tf, ...a }); } }
    results.sort((a, b) => b.score - a.score); return results.slice(0, 5);
}

function sparkSvg(pts, color) {
    if (!pts || pts.length < 2) return '';
    const min = Math.min(...pts), max = Math.max(...pts), range = max - min || 1, w = 64, h = 24;
    const coords = pts.map((v, i) => `${((i/(pts.length-1))*w).toFixed(1)},${(h - ((v-min)/range)*h).toFixed(1)}`).join(' ');
    return `<svg class="w-16 h-6 overflow-visible" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${coords}"/></svg>`;
}

let cdIv = null;
function startCd(tf = '15M') {
    if (cdIv) clearInterval(cdIv);
    const tfSecs = { '5M': 300, '15M': 900, '1H': 3600, '4H': 14400, '1D': 86400 }[tf] || 900;
    const tick = () => { const now = Math.floor(Date.now() / 1000); const rem = tfSecs - (now % tfSecs); const h = Math.floor(rem / 3600); const m = Math.floor((rem % 3600) / 60); const s = rem % 60; const el = document.getElementById('cd'); if (el) { if (tfSecs >= 3600) el.innerText = `${h}h ${String(m).padStart(2,'0')}m`; else el.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; } };
    tick(); cdIv = setInterval(tick, 1000);
}

function executeTrade(sym, type, entry, sl, tp, lots, tf = '15M') {
    const todayLosses = STATE.trades.filter(t => { try { return new Date(t.time).toDateString() === new Date().toDateString() && (t.status === 'SL HIT' || t.status === 'CLOSED -'); } catch(e) { return false; } });
    const last2Loss = STATE.trades.slice(0, 2).length >= 2 && STATE.trades.slice(0, 2).every(t => (t.status === 'SL HIT' || t.status === 'CLOSED -') && new Date(t.time).toDateString() === new Date().toDateString());
    if (last2Loss && todayLosses.length >= 2) { showToast('🛑 KILL SWITCH: 2 losses in a row. Take a break. No revenge trade.', 'error'); return; }

    const openRisk = STATE.trades.filter(t => t.status === 'OPEN').reduce((a, t) => a + (Math.abs(t.entry - t.sl) * t.lots * getMultiplier(t.symbol)), 0);
    const newRisk = Math.abs(entry - sl) * lots * getMultiplier(sym);
    if (openRisk + newRisk > STATE.balance * 0.03) { showToast('🛑 Max 3% open risk exceeded!', 'error'); return; }

    let todayPnL = STATE.balance - STATE.propFirm.todayStartBalance;
    let dailyLimit = STATE.propFirm.accountSize * (STATE.propFirm.dailyLimitPct / 100);
    if (todayPnL <= -dailyLimit) { showToast('🛑 Prop Firm Daily Loss Limit hit. Cannot trade.', 'error'); return; }

    const spreadCost = 2 * getPipValue(sym) * lots; const commission = 5 * lots;
    STATE.balance -= (spreadCost + commission);

    let safeTf = (tf && tf !== 'undefined' && tf !== 'null') ? tf : '15M';
    let note = esc(document.getElementById('tradeNote')?.value || 'No notes.');
    let emotion = document.getElementById('tradeEmotion').value;
    
    STATE.trades.unshift({ id: Date.now(), symbol: sym, type, entry: Number(entry), sl: Number(sl), tp: Number(tp), lots, tf: safeTf, rrRatio: `1:${STATE.defaultRr}`, pnl: 0, status: 'OPEN', time: new Date().toISOString(), beAlerted: false, partialClosed: false, partialPnl: 0, note: note, emotion: emotion, risk0: Math.abs(entry - sl) });
    saveState(); closeModal();
    showToast(`🚀 ${type} ${sym} opened`, 'success'); vib([150,50,150]);
    sendTg(`🚀 ${type} ${sym} (${safeTf})\nEntry $${fmtPrice(entry)}\nSL $${fmtPrice(sl)}\nTP $${fmtPrice(tp)}\nLot ${lots.toFixed(2)}`);
    pushNotif('trade', `Opened ${type} ${sym}`, `${lots.toFixed(2)} lots · ${safeTf}`);
    router.navigate('journal');
}

let spikeTimer = null;
function startNewsCountdown() {
    if (spikeTimer) clearInterval(spikeTimer);
    spikeTimer = setInterval(() => {
        const now = Date.now();
        document.querySelectorAll('.news-cd').forEach(el => {
            const target = parseInt(el.getAttribute('data-time'));
            const diff = target - now;
            if (diff < 0) { el.innerText = 'PASSED'; el.className = 'text-slate-500 font-mono text-[10px] font-bold news-cd'; } 
            else {
                const h = Math.floor(diff / 3600000); const m = Math.floor((diff % 3600000) / 60000); const s = Math.floor((diff % 60000) / 1000);
                if (h > 0) el.innerText = `T-${h}h ${m}m`; else el.innerText = `T-${m}m ${s}s`;
                if (diff < 15 * 60000) el.className = 'text-accentRed animate-pulse font-mono text-[10px] font-bold news-cd';
                else el.className = 'text-accentBlue font-mono text-[10px] font-bold news-cd';
            }
        });
    }, 1000);
}

function calcPrediction(ev) { 
    const f = parseFloat(String(ev.forecast).replace(/[^0-9.\-]/g, '')); const p = parseFloat(String(ev.previous).replace(/[^0-9.\-]/g, ''));
    let sur = 0; if (!isNaN(f) && !isNaN(p) && p !== 0) sur = ((f - p) / Math.abs(p)) * 100;
    let bias = 'NEUTRAL';
    if (sur > 0.05) bias = 'BULLISH';
    if (sur < -0.05) bias = 'BEARISH';
    if (ev.title.includes('Unemployment')) { if (sur > 0.05) bias = 'BEARISH'; if (sur < -0.05) bias = 'BULLISH'; }
    return { surprise: sur, bias: bias };
}

function buildAIContext() {
    const lines = [`=== DAGBO LIVE STATE ===`, `UTC: ${new Date().toUTCString()}`, `Balance: $${fmtPrice(STATE.balance)}`];
    lines.push(`\n=== LIVE PRICES ===`);
    for (const p of PAIRS) { const d = STATE.marketData[p.symbol]; if (d) lines.push(`${p.symbol}: $${fmtPrice(d.price, getDecimals(p.symbol))} (${d.change}%)`); }
    const open = STATE.trades.filter(t => t.status === 'OPEN');
    lines.push(`\n=== OPEN TRADES ===`);
    if (open.length === 0) lines.push('None'); else for (const t of open) lines.push(`${t.type} ${t.symbol} | Entry ${t.entry} | SL ${t.sl} | TP ${t.tp}`);
    return lines.join('\n');
}

async function aiCall(systemPrompt, userMessage, useSearch = true) {
  const context = buildAIContext();
  const finalPrompt = `${TRADING_EXPERT_PROMPT}\n\n${systemPrompt}\n\nLIVE DATA:\n${context}\n\nUser Question: ${userMessage}`;

  try {
      if (STATE.workerUrl && !STATE.workerUrl.includes('YOUR-NAME')) {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 5000);
          const r = await fetch(STATE.workerUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ system: systemPrompt, messages: [{role: 'user', content: userMessage}], search: useSearch }), signal: controller.signal });
          clearTimeout(timeoutId);
          if (r.ok) { const j = await r.json(); if (j.text) return j.text; }
      }
  } catch(e) { console.log("Worker failed, trying free AI..."); }

  try {
      const r = await fetch(`https://text.pollinations.ai/${encodeURIComponent(finalPrompt)}`);
      if (r.ok) { const text = await r.text(); if (text && text.length > 5) return text; }
  } catch(e) { console.log("Free AI failed, using local brain."); }

  return getLocalFallback(userMessage);
}

    try{ 
        const reply=await aiCall(sys,'Generate signal.',false); 
        const sig=JSON.parse(reply.match(/\{[\s\S]*\}/)[0]); 
        
        if (STATE.autoPilot && sig.confidence >= 85 && sig.signal !== 'NO TRADE') {
            const slPips = Math.abs(sig.entry - sig.stopLoss) / getPipSize(sig.symbol);

        const pr=STATE.marketData[t.symbol]?.price||4061; 
        const sl=t.direction==='BUY'?pr-5:pr+5;

            showToast('🤖 Auto-Pilot Executed Local Signal', 'success');
        } else {
            renderSignalCard({signal:t.direction,symbol:t.symbol,timeframe:t.tf,confidence:t.confidence,reasoning:'Local fallback: Worker offline, using Scanner.',entry:pr,stopLoss:sl,takeProfit:tp,strategy:'Local Scanner',pattern:'Momentum',indicators:'EMA+RSI'},false); 
        }
    }
}

        return;
    }
    if(!PAIRS.some(p=>p.symbol===sig.symbol)){ showToast('Invalid symbol from AI, ignored.','error'); return; }
    const isBuy = sig.signal==='BUY';
    const entry = Number(sig.entry ?? STATE.marketData[sig.symbol]?.price);
    const sl = Number(sig.stopLoss ?? sig.sl);
    const tp = Number(sig.takeProfit ?? sig.tp);

    if(!isBuy && !(sl > entry && tp < entry)){ showToast('AI SL/TP on wrong side, ignored.','error'); return; }
    const title = isSpike ? '⚡ PRE-NEWS SPIKE SIGNAL' : isPostSpike ? '🌊 POST-NEWS RETEST SIGNAL' : '🎯 AI TRADE SIGNAL';
    const slPips = Math.abs(entry - sl) / getPipSize(sig.symbol);
    const lot = finalLot(sig.symbol, slPips || 30);
    const dec = getDecimals(sig.symbol);
    
    openModal(`<div class="space-y-4"><div class="flex justify-between items-center"><h3 class="font-heading font-bold text-sm text-white">${title}</h3><button onclick="closeModal()" class="text-xs text-slate-400">✕</button></div><div class="rounded-2xl bg-darkBg border border-darkBorder p-4 space-y-2"><div class="flex justify-between"><span class="text-lg font-extrabold text-white">${esc(sig.signal)} ${esc(sig.symbol)}</span><span class="text-[10px] px-2 py-1 rounded-full bg-accentGreen/20 text-accentGreen font-bold">${esc(String(sig.confidence||75))}%</span></div><p class="text-[11px] text-slate-300">${esc(sig.reasoning||'')}</p></div><div class="rounded-2xl bg-darkSurface border border-accentBlue/30 p-3 space-y-1"><div class="text-[9px] font-bold text-accentBlue uppercase tracking-wider mb-1 text-center">Signal Source</div><div class="grid grid-cols-3 gap-1 text-[10px] text-slate-300 text-center"><div><span class="text-slate-500 block">Strategy</span><b class="text-white">${esc(sig.strategy || 'SMC / Price Action')}</b></div><div><span class="text-slate-500 block">Pattern</span><b class="text-white">${esc(sig.pattern || 'Liquidity Sweep')}</b></div><div><span class="text-slate-500 block">Indicators</span><b class="text-white">${esc(sig.indicators || 'EMA + RSI')}</b></div></div></div><div class="grid grid-cols-3 gap-2 text-center text-[11px]"><div class="p-2.5 rounded-xl bg-darkBg border border-darkBorder"><div class="text-slate-400 text-[9px]">Entry</div><div class="font-bold text-white">$${fmtPrice(entry, dec)}</div></div><div class="p-2.5 rounded-xl bg-darkBg border border-darkBorder"><div class="text-slate-400 text-[9px]">SL</div><div class="font-bold text-accentRed">$${fmtPrice(sl, dec)}</div></div><div class="p-2.5 rounded-xl bg-darkBg border border-darkBorder"><div class="text-slate-400 text-[9px]">TP</div><div class="font-bold text-accentGreen">$${fmtPrice(tp, dec)}</div></div></div><button onclick="openChecklist('${esc(sig.symbol)}','${esc(sig.signal)}', function renderJournal(c) {
    const closed = STATE.trades.filter(t => t.status !== 'OPEN');
    const tp = closed.reduce((a, t) => a + t.pnl, 0);
    const wins = closed.filter(t => t.pnl > 0);
    const losses = closed.filter(t => t.pnl < 0);
    
    const winRate = closed.length ? (wins.length/closed.length) : 0; 
    const avgWin = wins.length ? (wins.reduce((a,b)=>a+Math.abs(b.pnl),0)/wins.length) : 0; 
    const avgLoss = losses.length ? (losses.reduce((a,b)=>a+Math.abs(b.pnl),0)/losses.length) : 0;
    const expectancy = (winRate * avgWin) - ((1-winRate) * avgLoss); 
    const profitFactor = avgLoss > 0 ? ((wins.length * avgWin) / (losses.length * avgLoss)) : 0;
    
    const emoStats = {};
    closed.forEach(t => { if(t.emotion){ if(!emoStats[t.emotion]) emoStats[t.emotion] = {w:0, l:0}; if(t.pnl > 0) emoStats[t.emotion].w++; else emoStats[t.emotion].l++; }});
    const emoHtml = Object.keys(emoStats).map(e => {
        const s = emoStats[e]; const wr = Math.round((s.w / (s.w + s.l)) * 100);
        return `<div class="flex justify-between text-[10px] text-slate-400"><span>${e}</span><span class="${wr >= 50 ? 'text-accentGreen' : 'text-accentRed'}">${wr}%</span></div>`;
    }).join('');

        ${Object.keys(emoStats).length > 0 ? `<div class="rounded-3xl bg-darkSurface border border-darkBorder p-4 space-y-2"><h3 class="font-heading font-bold text-xs text-slate-400 uppercase">Emotion Win Rates</h3><div class="space-y-1">${emoHtml}</div></div>` : ''}

function exportCSV() {
    const rows = [['time','symbol','type','tf','entry','sl','tp','lots','status','pnl','note']];
    STATE.trades.forEach(t => rows.push([t.time,t.symbol,t.type,t.tf,t.entry,t.sl,t.tp,t.lots,t.status,t.pnl,`"${(t.note||'').replace(/"/g,'""')}"`]));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([rows.map(r => r.join(',')).join('\n')], {type:'text/csv'}));
    a.download = `dagbo-journal-${Date.now()}.csv`; a.click();
}

function panicCloseAll() { confirmAction('PANIC CLOSE ALL?', 'Close ALL open trades at current market price?', () => { backupState('Panic Close All'); let count = 0; STATE.trades.forEach(t => { if (t.status === 'OPEN') { const cur = STATE.marketData[t.symbol]?.price || t.entry; const pnl = (t.type === 'BUY' ? (cur - t.entry) : (t.entry - cur)) * t.lots * getMultiplier(t.symbol); t.pnl = pnl; t.status = pnl >= 0 ? 'CLOSED +' : 'CLOSED -'; STATE.balance += pnl; count++; } }); saveState(); showToast(`🚨 Closed ${count} trades!`, 'error'); renderJournal(document.getElementById('appContent')); }); }
function clearJ() { confirmAction('Clear Trades?', 'Delete journal?', () => { backupState('Clear Journal'); STATE.trades = []; saveState(); renderJournal(document.getElementById('appContent')); }); }
function closeEarly(id) { const t = STATE.trades.find(x => x.id === id); if (!t || t.status !== 'OPEN') return; confirmAction('Close Trade?', `Close ${t.symbol}?`, () => { backupState('Closed Trade'); const cur = STATE.marketData[t.symbol]?.price || t.entry; const pnl = (t.type === 'BUY' ? (cur - t.entry) : (t.entry - cur)) * t.lots * getMultiplier(t.symbol); t.pnl = pnl; t.status = pnl >= 0 ? 'CLOSED +' : 'CLOSED -'; STATE.balance += pnl; saveState(); showToast(`Closed: ${pnl>=0?'+':''}$${fmtPrice(pnl)}`, pnl>=0?'success':'error'); renderJournal(document.getElementById('appContent')); }); }
function shareTrade(id) { const t = STATE.trades.find(x => x.id === id); if(!t) return; const txt = `📊 ${t.type} ${t.symbol} (${t.rrRatio})\nEntry $${fmtPrice(t.entry)}\nSL $${fmtPrice(t.sl)}\nTP $${fmtPrice(t.tp)}\nStatus: ${t.status}\nPnL $${fmtPrice(t.pnl)}`; if(navigator.share) navigator.share({title:'DAGBO', text:txt}).catch(()=>{}); else if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>showToast('Copied','success')); }

function confirmAction(title, message, onConfirm, destructive = true) { openModal(`<div class="space-y-4"><div class="flex justify-between items-center"><h3 class="font-heading font-bold text-sm ${destructive?'text-accentRed':'text-white'}">${destructive?'⚠️ ':''}${title}</h3><button onclick="closeModal()" class="text-xs text-slate-400">✕</button></div><div class="rounded-2xl bg-darkBg border ${destructive?'border-accentRed/40':'border-darkBorder'} p-4 text-xs text-slate-300">${message}</div><div class="grid grid-cols-2 gap-2"><button onclick="closeModal()" class="py-3 rounded-2xl bg-darkSurface border border-darkBorder text-slate-300 font-bold text-sm">Cancel</button><button id="cfmBtn" class="py-3 rounded-2xl ${destructive?'bg-accentRed':'bg-accentGreen'} text-white font-bold text-sm">${destructive?'Yes, proceed':'Confirm'}</button></div></div>`); document.getElementById('cfmBtn').onclick = () => { closeModal(); onConfirm(); }; }
function backupState(reason) { const backups = JSON.parse(localStorage.getItem('dagbo_backups')||'[]'); backups.unshift({reason, time:Date.now(), balance:STATE.balance, trades:JSON.parse(JSON.stringify(STATE.trades)), alerts:JSON.parse(JSON.stringify(STATE.alerts)), chat:JSON.parse(JSON.stringify(STATE.activeChat)), notifs:JSON.parse(JSON.stringify(STATE.notifications)), settings:{riskMode:STATE.riskMode, riskPct:STATE.riskPct, defaultRr:STATE.defaultRr, manualLot:STATE.manualLot, soundMode:STATE.soundMode}}); localStorage.setItem('dagbo_backups', JSON.stringify(backups.slice(0,10))); }
function undoLast() { const backups = JSON.parse(localStorage.getItem('dagbo_backups')||'[]'); if(!backups.length){showToast('Nothing to undo','error');return;} const snap = backups[0]; STATE.balance=snap.balance; STATE.trades=snap.trades; STATE.alerts=snap.alerts; STATE.activeChat=snap.chat; STATE.notifications=snap.notifs; Object.assign(STATE, snap.settings); saveState(); backups.shift(); localStorage.setItem('dagbo_backups', JSON.stringify(backups)); showToast(`↩️ Undone: ${snap.reason}`,'success'); router.navigate(router.current); }

    const b = new Blob([json],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`dagbo-backup-${Date.now()}.json`; a.click();

}
function importBackup() { openModal(`<div class="space-y-4"><div class="flex justify-between items-center"><h3 class="font-heading font-bold text-sm text-white">Import</h3><button onclick="closeModal()" class="text-xs text-slate-400">✕</button></div><textarea id="importTxt" rows="8" class="w-full bg-darkBg border border-darkBorder rounded-xl px-3 py-2.5 text-[10px] text-white font-mono" placeholder='{"version":2,...}'></textarea><button onclick="doImport()" class="w-full py-3 rounded-2xl bg-accentGreen text-white font-bold text-sm">Import</button></div>`); }

function requestNotifPermission() {
    if (!('Notification' in window)) { showToast('Your phone/browser does not support notifications.', 'error'); return; }
    Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
            showToast('🔔 Phone Notifications Enabled!', 'success');
            new Notification('DAGBO Connected', { body: 'You will now receive real alerts for trades, news, and price targets.', icon: 'https://cdn-icons-png.flaticon.com/512/2933/2933859.png' });

    let currentTf = initialTf;
    function renderChartModal() {
        openModal(`<div class="space-y-4"><div class="flex justify-between items-center"><h3 class="font-heading font-bold text-sm text-white">${esc(sym)} · ${esc(currentTf)}</h3><button onclick="closeModal()" class="text-xs text-slate-400">✕</button></div><div class="flex space-x-1 bg-darkBg p-1 rounded-xl border border-darkBorder">${['5M','15M','1H','4H','1D'].map(t => `<button onclick="window._changeChartTf('${t}')" class="flex-1 py-1.5 rounded-lg text-[10px] font-bold ${currentTf === t ? 'bg-accentBlue text-white' : 'text-slate-400 hover:text-white'}">${t}</button>`).join('')}</div><div id="chartBox" class="w-full h-72 rounded-2xl bg-darkBg border border-darkBorder flex items-center justify-center text-xs text-slate-400">Loading ${currentTf} Data...</div><div class="flex justify-between text-[9px] text-slate-500 px-1"><span>🔴 SL</span><span>🔵 Entry</span><span>🟢 TP</span><span>🟠 FVG</span></div></div>`);
        drawRealChart();
    }
    window._changeChartTf = (newTf) => { currentTf = newTf; renderChartModal(); };
    async function drawRealChart() {
        const box = document.getElementById('chartBox'); if (!box || !window.LightweightCharts) return;
        box.innerHTML = ''; let data = [];
        const intervalMap = { '5M': '5min', '15M': '15min', '1H': '1h', '4H': '4h', '1D': '1day' };
        const binanceMap = { '5M': '5m', '15M': '15m', '1H': '1h', '4H': '4h', '1D': '1d' };
        const pair = PAIRS.find(p => p.symbol === sym);
        
        try {
            if(sym === 'GOLD' || sym === 'BTC/USD'){
                const bSym = sym === 'GOLD' ? 'PAXGUSDT' : 'BTCUSDT';
                const d = await fetch(`https://api.binance.com/api/v3/klines?symbol=${bSym}&interval=${binanceMap[currentTf] || '15m'}&limit=50`).then(r=>r.json());
                data = d.map(k => ({ time: k[0]/1000, open: +k[1], high: +k[2], low: +k[3], close: +k[4] }));
            } else {
                const r = await fetch(`https://api.twelvedata.com/time_series?symbol=${pair.td}&interval=${intervalMap[currentTf] || '15min'}&outputsize=50&apikey=${STATE.twelveKey}`);
                const json = await r.json();
                if (json.status === "error" || !json.values) throw new Error("API Error");
                data = json.values.map(v => ({ time: new Date(v.datetime).getTime() / 1000, open: parseFloat(v.open), high: parseFloat(v.high), low: parseFloat(v.low), close: parseFloat(v.close) })).reverse();
            }
        } catch(e) {
            const base = STATE.marketData[sym]?.price || 100; let p = base; const tfSecs = { '5M': 300, '15M': 900, '1H': 3600, '4H': 14400, '1D': 86400 }[currentTf] || 900; let time = Math.floor(Date.now() / 1000) - (tfSecs * 50);
            for (let i = 0; i < 50; i++) { const o = p + (Math.random() - 0.5) * base * 0.005; const c = o + (Math.random() - 0.48) * base * 0.006; data.push({ time: time, open: o, high: Math.max(o, c) + Math.random() * base * 0.002, low: Math.min(o, c) - Math.random() * base * 0.002, close: c }); p = c; time += tfSecs; }
        }

        const chart = LightweightCharts.createChart(box, { layout: { background: { type: 'solid', color: '#0A0E17' }, textColor: '#94A3B8' }, grid: { vertLines: { color: '#1E293B' }, horzLines: { color: '#1E293B' } }, rightPriceScale: { borderColor: '#1E293B' }, timeScale: { borderColor: '#1E293B', timeVisible: true } });
        const s = chart.addCandlestickSeries({ upColor: '#10B981', downColor: '#EF4444', borderVisible: false, wickUpColor: '#10B981', wickDownColor: '#EF4444' });
        s.setData(data); chart.timeScale().fitContent();

        const openTrade = STATE.trades.find(t => t.status === 'OPEN' && t.symbol === sym);
        if (openTrade) {
            s.createPriceLine({ price: openTrade.entry, color: '#3B82F6', lineWidth: 2, lineStyle: 0, axisLabelVisible: true, title: 'ENTRY' });
            s.createPriceLine({ price: openTrade.sl, color: '#EF4444', lineWidth: 2, lineStyle: 2, axisLabelVisible: true, title: 'SL' });
            s.createPriceLine({ price: openTrade.tp, color: '#10B981', lineWidth: 2, lineStyle: 2, axisLabelVisible: true, title: 'TP' });
        }

        for (let i = 1; i < data.length - 1; i++) {
            const prev = data[i-1], next = data[i+1];
            if (prev.high < next.low) {
                s.createPriceLine({ price: prev.high, color: 'rgba(16, 185, 129, 0.4)', lineWidth: 1, lineStyle: 3, axisLabelVisible: false, title: 'FVG' });
                s.createPriceLine({ price: next.low, color: 'rgba(16, 185, 129, 0.4)', lineWidth: 1, lineStyle: 3, axisLabelVisible: false, title: 'FVG' });
            }
            if (prev.low > next.high) {
                s.createPriceLine({ price: prev.low, color: 'rgba(239, 68, 68, 0.4)', lineWidth: 1, lineStyle: 3, axisLabelVisible: false, title: 'FVG' });
                s.createPriceLine({ price: next.high, color: 'rgba(239, 68, 68, 0.4)', lineWidth: 1, lineStyle: 3, axisLabelVisible: false, title: 'FVG' });
            }
        }
    }
    renderChartModal();
}

router.navigate('home');
checkOnboarding();
</script>
</body>
</html>
